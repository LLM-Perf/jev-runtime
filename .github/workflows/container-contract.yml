name: Gateway container packaging
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/container-contract.yml'
      - 'deployment/**'
      - 'src/**'
      - 'packages/**'
      - 'pyproject.toml'
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'build>=1.2,<2' 'hatchling>=1.26' -e .
      - name: Build and run actual offline gateway image
        run: python -m deployment.container_smoke --output "$RUNNER_TEMP/jev-container" > container-build.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gateway-container-evidence
          path: |
            container-build.log
            ${{ runner.temp }}/jev-container/container-smoke.json
            ${{ runner.temp }}/jev-container/context/image.json
            ${{ runner.temp }}/jev-container/image-id.txt
