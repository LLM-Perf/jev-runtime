name: Publish Python packages to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'LLM-Perf/jev-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check release tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit("release tag must start with v")
          expected = tag.removeprefix("v")
          projects = [
              pathlib.Path("pyproject.toml"),
              pathlib.Path("packages/sglang/pyproject.toml"),
              pathlib.Path("packages/vllm/pyproject.toml"),
              pathlib.Path("packages/tokenspeed/pyproject.toml"),
          ]
          versions = {
              str(path): tomllib.loads(path.read_text())["project"]["version"]
              for path in projects
          }
          mismatches = {path: version for path, version in versions.items() if version != expected}
          if mismatches:
              raise SystemExit(f"tag {tag!r} does not match package versions: {mismatches}")
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install --disable-pip-version-check 'build>=1.2,<2' 'twine>=7,<8'
          python -m build --sdist --wheel --outdir dist .
          python -m build --sdist --wheel --outdir dist packages/sglang
          python -m build --sdist --wheel --outdir dist packages/vllm
          python -m build --sdist --wheel --outdir dist packages/tokenspeed
          python -m twine check --strict dist/*
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jev-runtime-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
