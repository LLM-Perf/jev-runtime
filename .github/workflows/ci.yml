name: Core and plugin contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' -e packages/sglang -e packages/vllm
      - run: ruff check src tests packages
      - run: ruff format --check src tests packages
      - run: pytest -q
      - run: python -m build
      - run: python -m build packages/sglang
      - run: python -m build packages/vllm
