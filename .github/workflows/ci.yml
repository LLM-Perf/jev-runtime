name: Core and plugin contracts
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,tokenizers,tokenizer-conversion]' -e packages/sglang -e packages/vllm -e packages/tokenspeed
      - run: ruff check src tests packages deployment benchmarks
      - run: ruff format --check src tests packages deployment benchmarks
      - run: pytest -q
      - run: python -m build
      - run: python -m build packages/sglang
      - run: python -m build packages/vllm
      - run: python -m build packages/tokenspeed
      - name: Install only built wheels in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/jev-wheel-env"
          core=(dist/jev_runtime_core-*.whl)
          "$RUNNER_TEMP/jev-wheel-env/bin/python" -m pip install "${core[0]}[tokenizers,tokenizer-conversion]" packages/{vllm,sglang,tokenspeed}/dist/*.whl
          "$RUNNER_TEMP/jev-wheel-env/bin/python" -m pip check
          "$RUNNER_TEMP/jev-wheel-env/bin/python" -I deployment/wheel_smoke.py
          "$RUNNER_TEMP/jev-wheel-env/bin/jevctl" backend list
          "$RUNNER_TEMP/jev-wheel-env/bin/jev-tokenspeed" --help
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript
