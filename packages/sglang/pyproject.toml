[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "jev-sglang"
version = "0.1.0a1"
description = "Native SGLang plugin for Jev typed decision serving"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["llm", "sglang", "inference", "classification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["jev-runtime-core==0.1.0a1"]

[project.scripts]
jev-sglang = "jev_sglang.launcher:main"

[project.entry-points."sglang.srt.plugins"]
jev_runtime = "jev_sglang.plugin:register"

[project.urls]
Homepage = "https://github.com/LLM-Perf/jev-runtime"
Issues = "https://github.com/LLM-Perf/jev-runtime/issues"
Source = "https://github.com/LLM-Perf/jev-runtime"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_sglang"]
